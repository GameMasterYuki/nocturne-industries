<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NOCTURNE INDUSTRIES</title><style>:root{--bg:#05070b;--panel:rgba(8,10,15,.94);--line:#715f47;--gold:#c7a66f;--violet:#b07ad8;--text:#f2eee5;--muted:#aaa49a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030407;color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;overflow:hidden}button{font:inherit;color:inherit}#app{height:100dvh;display:grid;grid-template-rows:78px minmax(0,1fr);background:#05070a;overflow:hidden}.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:'logo actions' 'meta meta';background:rgba(7,9,14,.98);border-bottom:1px solid #30281f;z-index:10}.logo{grid-area:logo;display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:15px;letter-spacing:.06em}.mark{font-size:24px;color:var(--gold)}.actions{grid-area:actions;display:flex;gap:5px;align-items:center;padding-right:8px}.actions button{height:34px;padding:0 11px;border:1px solid #66543d;background:#0d1016;font-size:11px}.meta{grid-area:meta;display:flex;gap:10px;align-items:center;min-height:33px;padding:5px 12px 6px;border-top:1px solid #222832;font-size:11px;white-space:nowrap;overflow:hidden}.meta small{font-size:9px;color:#b3aa9d}.screen{height:100%;min-height:0;display:grid;grid-template-rows:46% 35% 19%;position:relative;background:url('assets/scene_001_victoria.webp') 50% center/cover no-repeat;overflow:hidden}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,8,.03) 0%,rgba(3,5,8,.18) 34%,rgba(3,5,8,.9) 63%,rgba(3,5,8,.99) 100%);pointer-events:none}.visual,.dialogue,.hud{position:relative;z-index:2}.visual{grid-row:1}.namecard{position:absolute;left:10px;top:10px;width:min(58vw,210px);padding:10px 12px;border:1px solid var(--line);background:rgba(8,10,15,.82);backdrop-filter:blur(6px)}.namecard h2{font-size:17px;margin:0 0 3px;font-weight:500}.role{font-size:9px;color:#d0c8be}.dialogue{grid-row:2;margin:0 9px 7px;padding:13px 15px 12px;border:1px solid #756249;background:rgba(8,10,15,.95);backdrop-filter:blur(8px);display:flex;flex-direction:column;min-height:0}.speaker{color:var(--violet);font-size:14px;margin-bottom:8px;font-weight:600}.text{font-size:14px;line-height:1.58;white-space:pre-wrap;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}.next{align-self:flex-end;margin-top:8px;border:0;background:transparent;color:#d5b87e;font-size:20px;min-width:44px;min-height:32px}.choices{display:grid;gap:6px;height:100%;overflow:auto}.choice{display:grid;grid-template-columns:38px 1fr;align-items:center;min-height:53px;border:1px solid #665945;background:rgba(8,10,15,.95);text-align:left;padding:0}.choice:active{border-color:#b995d1;background:linear-gradient(90deg,rgba(66,37,88,.82),rgba(29,22,38,.95))}.num{height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #4a4033;font-size:17px}.label{padding:6px 9px;font-size:12.5px;line-height:1.2}.label small{display:block;font-size:8.5px;color:#8e8b86;margin-top:2px}.hud{grid-row:3;display:grid;grid-template-columns:44% 56%;background:rgba(8,10,15,.99);border-top:1px solid #594a38}.params{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.p{text-align:center;border-right:1px solid #2b2f37}.p:last-child{border-right:0}.p span{display:block;font-size:8px}.p b{display:block;color:#e6c47f;font-size:15px}.finance{display:grid;grid-template-columns:1fr 1fr;align-items:center}.finance>div{padding:0 7px;border-left:1px solid #383026}.finance span{display:block;font-size:8px;color:#d5bd89}.finance b{display:block;font-size:13px}.finance small{display:block;font-size:7.5px}.complete{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;height:100%;padding:12px}.complete h3{margin:0;color:#d6b987;font-weight:500}.complete p{margin:0;font-size:11px;line-height:1.6;color:#cbc5bb}#titleScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#05070a url('assets/scene_001_victoria.webp') 50% center/cover no-repeat;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}#titleScreen:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,3,6,.28),rgba(2,3,6,.15) 30%,rgba(2,3,6,.55) 58%,rgba(2,3,6,.97) 100%)}.titleContent{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}.titleMark{width:54px;height:54px;border:2px solid var(--gold);transform:rotate(45deg);margin-bottom:16px}.titleLogo{font-size:33px;letter-spacing:.14em}.titleIndustries{margin-top:7px;font-size:10px;letter-spacing:.58em;padding-left:.58em}.tagline{margin:15px 0 28px;font-size:11px}.tagline em{font-style:normal;color:#c78de7}.titleMenu{width:100%;display:grid;gap:9px}.titleBtn{width:100%;min-height:59px;border:1px solid #7b684d;background:rgba(8,10,15,.95);text-align:left;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.titleBtn strong{font-size:20px;font-weight:500}.titleBtn small{display:block;color:#9c958a;font-size:9px;margin-top:3px}.titleBtn.primary{min-height:72px;justify-content:center;text-align:center;border-color:#b88bda;background:linear-gradient(90deg,rgba(68,35,89,.83),rgba(30,20,41,.95))}.titleBtn.primary strong{font-size:27px;letter-spacing:.12em}.continueMeta{font-size:9px;color:#d6a9ee;border:1px solid #684b79;background:#25162d;padding:6px 8px}.titleBtn:disabled{opacity:.38}.notice{position:fixed;top:84px;left:12px;right:12px;z-index:150;padding:9px 12px;border:1px solid #8e7552;background:#0b0e14;text-align:center;font-size:11px;display:none}@media(min-width:721px){#titleScreen{padding:36px max(22px,calc((100vw - 540px)/2)) 38px}.titleMenu{max-width:520px}.screen{grid-template-columns:44% 56%;grid-template-rows:1fr 150px}.visual{grid-column:1;grid-row:1}.dialogue{grid-column:2;grid-row:1;margin:22px 18px}.hud{grid-column:1/3;grid-row:2}}</style></head><body><div id="titleScreen"><div class="titleContent"><div class="titleMark"></div><div class="titleLogo">NOCTURNE</div><div class="titleIndustries">INDUSTRIES</div><div class="tagline">黒い高層のその先で、<em>あなたの決断</em>が未来を創る。</div><div class="titleMenu"><button class="titleBtn primary" onclick="gameStart()"><div><strong>GAME START</strong><small>SCENE 001から始める</small></div></button><button id="continueBtn" class="titleBtn" onclick="continueGame()"><div><strong>CONTINUE</strong><small>前回の続きから</small></div><span id="continueMeta" class="continueMeta">NO DATA</span></button></div></div></div><div id="app"><header class="top"><div class="logo"><span class="mark">◇</span><b>NOCTURNE</b></div><div class="actions"><button onclick="flash('LOGは後日実装予定です')">LOG</button><button onclick="openTitle()">MENU</button></div><div class="meta"><b>SCENE 001</b><span>ヴィクトリア・クロウ</span><small>DAY 1 / 09:10</small></div></header><div id="game"></div></div><div id="notice" class="notice"></div><script>const SAVE='nocturne_official_v001';const pages=[{sp:'SYSTEM',tx:'東京・丸の内。\n\n午前9時10分。\n\nあなたは、NOCTURNE INDUSTRIES本社の最上階へ向かうエレベーターの中にいた。\n\n呼び出した人物は、CEO――ヴィクトリア・クロウ。'},{sp:'SYSTEM',tx:'会社から届いた連絡は、たった二行。\n\n「経営企画室へ。9:00。」\n「CEOがお待ちです。」\n\n説明は、それだけだった。'},{sp:'ヴィクトリア・クロウ',tx:'「入って。」\n\n静かな声だった。\n\n夜景を見るために作られたような広い執務室。その中央で、一人の女性があなたを待っている。'},{sp:'ヴィクトリア・クロウ',tx:'「あなたが、新しく入る幹部候補ね。」\n\n彼女は資料から目を上げる。\n\n美しい。だが、それ以上に――こちらを値踏みする視線が鋭い。'},{sp:'ヴィクトリア・クロウ',tx:'「この会社は、甘くないわ。」\n\n「結果だけが、あなたの価値になる。」\n\n少しだけ口元を緩める。\n\n「それでも来た。……覚悟はできてる？」'},{sp:'ヴィクトリア・クロウ',tx:'「あなたの力が必要です。」\n\n机の上に、一冊の薄いファイルが置かれた。\n\n表紙には――\n\nNOCTURNE MATERIALS\n再建計画\n\nと記されている。',choices:[['会社の状況を教えてください。','まず現状を正確に把握したい。'],['私に何を期待していますか？','自分の役割とミッションを知りたい。'],['なぜ私を選んだのですか？','あなたの評価基準を聞きたい。'],['すぐにでも成果を出します。','覚悟を行動で示す。']]}];let st={page:0,j:3,b:3,t:5,f:'2.8億',choice:null};function load(){try{let x=JSON.parse(localStorage.getItem(SAVE)||'null');if(x)st={...st,...x}}catch(e){}}function save(){localStorage.setItem(SAVE,JSON.stringify(st))}function flash(x){let n=document.getElementById('notice');n.textContent=x;n.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>n.style.display='none',1500)}function render(){let p=pages[st.page]||pages[pages.length-1];let body='';if(st.choice){body=`<div class="complete"><h3>SCENE 001 COMPLETE</h3><p>選択肢 ${st.choice} を記録しました。<br>次回アップデートで、この選択からSCENE 002へ続きます。</p></div>`}else if(p.choices){body=`<div class="choices">${p.choices.map((c,i)=>`<button class="choice" onclick="choose(${i+1})"><span class="num">${i+1}</span><span class="label">${c[0]}<small>${c[1]}</small></span></button>`).join('')}</div>`}else{body=`<div class="speaker">${p.sp}</div><div class="text">${p.tx}</div><button class="next" onclick="nextPage()">▼</button>`}document.getElementById('game').innerHTML=`<main class="screen"><section class="visual"><div class="namecard"><h2>ヴィクトリア・クロウ</h2><div class="role">NOCTURNE INDUSTRIES CEO</div></div></section><section class="dialogue">${body}</section><footer class="hud"><div class="params"><div class="p"><span>判断力</span><b>${st.j}</b></div><div class="p"><span>大胆さ</span><b>${st.b}</b></div><div class="p"><span>信頼</span><b>${st.t}</b></div></div><div class="finance"><div><span>FUNDS</span><b>${st.f}</b><small>利用可能資金</small></div><div><span>INVESTMENT</span><b>—</b><small>ポジションなし</small></div></div></footer></main>`}function nextPage(){if(st.page<pages.length-1){st.page++;save();render()}}function choose(n){st.choice=n;if(n===1)st.j++;if(n===2)st.t++;if(n===3)st.j++;if(n===4)st.b++;save();render()}function updateContinue(){let x=null;try{x=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}let b=document.getElementById('continueBtn');let m=document.getElementById('continueMeta');if(!x){b.disabled=true;m.textContent='NO DATA'}else{b.disabled=false;m.textContent=x.choice?'SCENE 001 COMPLETE':`PAGE ${x.page+1}`}}function gameStart(){if(localStorage.getItem(SAVE)&&!confirm('現在の進行を消して、SCENE 001から始めますか？'))return;st={page:0,j:3,b:3,t:5,f:'2.8億',choice:null};save();document.getElementById('titleScreen').style.display='none';render();updateContinue()}function continueGame(){load();document.getElementById('titleScreen').style.display='none';render()}function openTitle(){updateContinue();document.getElementById('titleScreen').style.display='flex'}load();render();updateContinue();</script></body></html>
