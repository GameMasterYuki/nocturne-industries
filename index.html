<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NOCTURNE INDUSTRIES</title><style>:root{--bg:#05070b;--panel:rgba(8,10,15,.95);--line:#715f47;--gold:#c7a66f;--violet:#c07be5;--text:#f2eee5;--muted:#aaa49a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030407;color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;overflow:hidden}button{font:inherit;color:inherit}#app{height:100dvh;display:grid;grid-template-rows:78px minmax(0,1fr);background:#05070a;overflow:hidden}.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:'logo actions' 'meta meta';background:rgba(7,9,14,.98);border-bottom:1px solid #30281f;z-index:10}.logo{grid-area:logo;display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:15px;letter-spacing:.06em}.mark{font-size:24px;color:var(--gold)}.actions{grid-area:actions;display:flex;gap:5px;align-items:center;padding-right:8px}.actions button{height:34px;padding:0 11px;border:1px solid #66543d;background:#0d1016;font-size:11px}.meta{grid-area:meta;display:flex;gap:10px;align-items:center;min-height:33px;padding:5px 12px 6px;border-top:1px solid #222832;font-size:11px;white-space:nowrap;overflow:hidden}.meta small{font-size:9px;color:#b3aa9d}.screen{height:100%;min-height:0;display:grid;grid-template-rows:46% 35% 19%;position:relative;background:#05070a var(--scene-bg) 50% center/cover no-repeat;overflow:hidden}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,8,.04),rgba(3,5,8,.18) 36%,rgba(3,5,8,.90) 64%,rgba(3,5,8,.99));pointer-events:none}.visual,.dialogue,.hud{position:relative;z-index:2}.visual{grid-row:1}.namecard{position:absolute;left:10px;top:10px;width:min(63vw,235px);padding:10px 12px;border:1px solid var(--line);background:rgba(8,10,15,.84);backdrop-filter:blur(6px)}.namecard h2{font-size:17px;margin:0 0 3px;font-weight:500}.role{font-size:9px;color:#d0c8be}.dialogue{grid-row:2;margin:0 9px 7px;padding:13px 15px 12px;border:1px solid #756249;background:rgba(8,10,15,.96);backdrop-filter:blur(8px);display:flex;flex-direction:column;min-height:0}.speaker{color:var(--violet);font-size:14px;margin-bottom:8px;font-weight:600}.text{font-size:14px;line-height:1.58;white-space:pre-wrap;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}.next{align-self:flex-end;margin-top:8px;border:0;background:transparent;color:#d5b87e;font-size:20px;min-width:44px;min-height:32px}.choices{display:grid;gap:6px;height:100%;overflow:auto}.choice{display:grid;grid-template-columns:38px 1fr auto;align-items:center;min-height:53px;border:1px solid #665945;background:rgba(8,10,15,.96);text-align:left;padding:0}.choice:active{border-color:#b995d1;background:linear-gradient(90deg,rgba(66,37,88,.82),rgba(29,22,38,.95))}.num{height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #4a4033;font-size:17px}.label{padding:6px 9px;font-size:12px;line-height:1.2}.label small{display:block;font-size:8.5px;color:#8e8b86;margin-top:2px}.buff{font-size:8px;margin-right:8px;padding:5px 6px;border:1px solid #604c6e;color:#d8a5f0;background:#211429;white-space:nowrap}.hud{grid-row:3;display:grid;grid-template-columns:44% 56%;background:rgba(8,10,15,.99);border-top:1px solid #594a38}.params{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.p{text-align:center;border-right:1px solid #2b2f37}.p:last-child{border-right:0}.p span{display:block;font-size:8px}.p b{display:block;color:#e6c47f;font-size:15px}.finance{display:grid;grid-template-columns:1fr 1fr;align-items:center}.finance>div{padding:0 7px;border-left:1px solid #383026}.finance span{display:block;font-size:8px;color:#d5bd89}.finance b{display:block;font-size:13px}.finance small{display:block;font-size:7.5px}.complete{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;height:100%;padding:12px}.complete h3{margin:0;color:#d6b987;font-weight:500}.complete p{margin:0;font-size:11px;line-height:1.6;color:#cbc5bb}#titleScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#05070a url('assets/scene_001_victoria.webp') 50% center/cover no-repeat;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}#titleScreen:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,3,6,.28),rgba(2,3,6,.15) 30%,rgba(2,3,6,.55) 58%,rgba(2,3,6,.97) 100%)}.titleContent{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}.titleMark{width:54px;height:54px;border:2px solid var(--gold);transform:rotate(45deg);margin-bottom:16px}.titleLogo{font-size:33px;letter-spacing:.14em}.titleIndustries{margin-top:7px;font-size:10px;letter-spacing:.58em;padding-left:.58em}.tagline{margin:15px 0 28px;font-size:11px}.tagline em{font-style:normal;color:#c78de7}.titleMenu{width:100%;display:grid;gap:9px}.titleBtn{width:100%;min-height:59px;border:1px solid #7b684d;background:rgba(8,10,15,.95);text-align:left;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.titleBtn strong{font-size:20px;font-weight:500}.titleBtn small{display:block;color:#9c958a;font-size:9px;margin-top:3px}.titleBtn.primary{min-height:72px;justify-content:center;text-align:center;border-color:#b88bda;background:linear-gradient(90deg,rgba(68,35,89,.83),rgba(30,20,41,.95))}.titleBtn.primary strong{font-size:27px;letter-spacing:.12em}.continueMeta{font-size:9px;color:#d6a9ee;border:1px solid #684b79;background:#25162d;padding:6px 8px}.titleBtn:disabled{opacity:.38}.notice{position:fixed;top:84px;left:12px;right:12px;z-index:150;padding:9px 12px;border:1px solid #8e7552;background:#0b0e14;text-align:center;font-size:11px;display:none}@media(min-width:721px){#titleScreen{padding:36px max(22px,calc((100vw - 540px)/2)) 38px}.titleMenu{max-width:520px}.screen{grid-template-columns:44% 56%;grid-template-rows:1fr 150px}.visual{grid-column:1;grid-row:1}.dialogue{grid-column:2;grid-row:1;margin:22px 18px}.hud{grid-column:1/3;grid-row:2}}</style></head><body><div id="titleScreen"><div class="titleContent"><div class="titleMark"></div><div class="titleLogo">NOCTURNE</div><div class="titleIndustries">INDUSTRIES</div><div class="tagline">黒い高層のその先で、<em>あなたの決断</em>が未来を創る。</div><div class="titleMenu"><button class="titleBtn primary" onclick="gameStart()"><div><strong>GAME START</strong><small>SCENE 001から始める</small></div></button><button id="continueBtn" class="titleBtn" onclick="continueGame()"><div><strong>CONTINUE</strong><small>前回の続きから</small></div><span id="continueMeta" class="continueMeta">NO DATA</span></button></div></div></div><div id="app"><header class="top"><div class="logo"><span class="mark">◇</span><b>NOCTURNE</b></div><div class="actions"><button onclick="flash('LOGは後日実装予定です')">LOG</button><button onclick="openTitle()">MENU</button></div><div id="meta" class="meta"></div></header><div id="game"></div></div><div id="notice" class="notice"></div><script>const SAVE='nocturne_official_v001';const scene1=[{sp:'SYSTEM',tx:'東京・丸の内。\n\n午前9時10分。\n\nあなたは、NOCTURNE INDUSTRIES本社の最上階へ向かうエレベーターの中にいた。\n\n呼び出した人物は、CEO――ヴィクトリア・クロウ。'},{sp:'SYSTEM',tx:'会社から届いた連絡は、たった二行。\n\n「経営企画室へ。9:00。」\n「CEOがお待ちです。」\n\n説明は、それだけだった。'},{sp:'ヴィクトリア・クロウ',tx:'「入って。」\n\n静かな声だった。\n\n広い執務室。その中央で、一人の女性があなたを待っている。'},{sp:'ヴィクトリア・クロウ',tx:'「あなたが、新しく入る幹部候補ね。」\n\n彼女は資料から目を上げる。\n\n美しい。だが、それ以上に――こちらを値踏みする視線が鋭い。'},{sp:'ヴィクトリア・クロウ',tx:'「この会社は、甘くないわ。」\n\n「結果だけが、あなたの価値になる。」\n\n「それでも来た。……覚悟はできてる？」'},{sp:'ヴィクトリア・クロウ',tx:'机の上に、一冊の薄いファイルが置かれた。\n\nNOCTURNE MATERIALS\n再建計画',choices:[['会社の状況を教えてください。','まず現状を正確に把握したい。','判断力 UP'],['私に何を期待していますか？','自分の役割とミッションを知りたい。','信頼 UP'],['なぜ私を選んだのですか？','あなたの評価基準を聞きたい。','判断力 UP'],['すぐにでも成果を出します。','覚悟を行動で示す。','大胆さ UP']]}];function responseForChoice(n){return {1:'「いいわ。まず数字を見る――その姿勢は嫌いじゃない。」\n\n「ただし、資料に書いてあることだけが会社の真実だと思わないことね。」',2:'「期待しているのは、私の代わりに考える人間じゃない。」\n\n「私が見落とすものを見つけて、必要なら私にも反対できる人間よ。」',3:'「なぜ、ね。」\n\n「あなたは、答えがない場所で決められる。少なくとも――私はそう評価した。」',4:'「その言葉、覚えておくわ。」\n\n「勢いは嫌いじゃない。でも、成果を急いで会社を壊した人間も私は何人も見てきた。」'}[n]||'ヴィクトリアは静かにあなたを見つめている。'}function scene2(){return[{sp:'ヴィクトリア・クロウ',tx:responseForChoice(st.choice1)},{sp:'ヴィクトリア・クロウ',tx:'「では、任せるわ。」\n\n彼女は卓上端末に触れる。\n\n「エマ。入って。」'},{sp:'SYSTEM',tx:'数秒後、扉が開く。\n\n金色の高いポニーテール。紫の瞳。白いブラウスに黒いベスト。\n\nタブレットを抱えた女性が、あなたを待っていた。'},{sp:'エマ・ローレンス',tx:'「お待ちしていました。」\n\n柔らかな笑顔を向けた直後、腕の中のファイルが少しずれる。\n\n「あっ……」\n\n落ちる寸前で器用に受け止め、少し照れたように笑った。\n\n「エマ・ローレンスです。今日から、あなたをサポートします。」'},{sp:'エマ・ローレンス',tx:'「NOCTURNE MATERIALSは、三四半期連続で営業赤字です。」\n\n「主要顧客との契約更新まで21日。工場在庫には小さな差異が続いています。」'},{sp:'エマ・ローレンス',tx:'「最初に、どこから見ますか？」',choices:[['数字を確認する','損益・在庫・受注の流れから異常を探す。','判断力 UP'],['工場へ向かう','現場を自分の目で見る。','信頼 UP'],['主要顧客を調べる','21日後の契約更新から逆算する。','判断力 UP'],['予告なしで会社へ行く','準備されていない現実を見る。','大胆さ UP']]}]}let st={scene:1,page:0,j:3,b:3,t:5,f:'2.8億',choice1:null,choice2:null};function migrate(x){if(!x)return null;if(x.scene)return x;if(x.choice)return{scene:2,page:0,j:x.j||3,b:x.b||3,t:x.t||5,f:x.f||'2.8億',choice1:x.choice,choice2:null};return{scene:1,page:x.page||0,j:x.j||3,b:x.b||3,t:x.t||5,f:x.f||'2.8億',choice1:null,choice2:null}}function load(){try{let x=migrate(JSON.parse(localStorage.getItem(SAVE)||'null'));if(x)st={...st,...x}}catch(e){}}function save(){localStorage.setItem(SAVE,JSON.stringify(st))}function flash(x){let n=document.getElementById('notice');n.textContent=x;n.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>n.style.display='none',1500)}function currentPages(){return st.scene===1?scene1:scene2()}function sceneInfo(){if(st.scene===1)return['SCENE 001','ヴィクトリア・クロウ','DAY 1 / 09:10'];if(st.scene===2)return['SCENE 002','エマ・ローレンス','DAY 1 / 09:22'];return['SCENE 003','NEXT UPDATE','—']}function character(){if(st.scene===2&&st.page>=2)return['エマ・ローレンス','NOCTURNE INDUSTRIES / EXECUTIVE ASSISTANT'];return['ヴィクトリア・クロウ','NOCTURNE INDUSTRIES CEO']}function bg(){return st.scene===1?"url('assets/scene_001_victoria.webp')":"url('assets/scene_002_emma.webp')"}function hud(){return `<footer class="hud"><div class="params"><div class="p"><span>判断力</span><b>${st.j}</b></div><div class="p"><span>大胆さ</span><b>${st.b}</b></div><div class="p"><span>信頼</span><b>${st.t}</b></div></div><div class="finance"><div><span>FUNDS</span><b>${st.f}</b><small>利用可能資金</small></div><div><span>INVESTMENT</span><b>—</b><small>ポジションなし</small></div></div></footer>`}function render(){let info=sceneInfo();document.getElementById('meta').innerHTML=`<b>${info[0]}</b><span>${info[1]}</span><small>${info[2]}</small>`;if(st.scene===3){document.getElementById('game').innerHTML=`<main class="screen" style="--scene-bg:url('assets/scene_002_emma.webp')"><section class="visual"></section><section class="dialogue"><div class="complete"><h3>SCENE 002 COMPLETE</h3><p>最初の調査方針を記録しました。<br>SCENE 003は、この選択から続きます。</p></div></section>${hud()}</main>`;return}let p=currentPages()[st.page]||currentPages().at(-1),body='',c=character();if(p.choices){body=`<div class="choices">${p.choices.map((x,i)=>`<button class="choice" onclick="choose(${i+1})"><span class="num">${i+1}</span><span class="label">${x[0]}<small>${x[1]}</small></span><span class="buff">${x[2]}</span></button>`).join('')}</div>`}else body=`<div class="speaker">${p.sp}</div><div class="text">${p.tx}</div><button class="next" onclick="nextPage()">▼</button>`;document.getElementById('game').innerHTML=`<main class="screen" style="--scene-bg:${bg()}"><section class="visual"><div class="namecard"><h2>${c[0]}</h2><div class="role">${c[1]}</div></div></section><section class="dialogue">${body}</section>${hud()}</main>`}function nextPage(){if(st.page<currentPages().length-1){st.page++;save();render()}}function choose(n){if(st.scene===1){st.choice1=n;if(n===1||n===3)st.j++;if(n===2)st.t++;if(n===4)st.b++;st.scene=2;st.page=0}else if(st.scene===2){st.choice2=n;if(n===1||n===3)st.j++;if(n===2)st.t++;if(n===4)st.b++;st.scene=3;st.page=0}save();render();updateContinue()}function gameStart(){if(localStorage.getItem(SAVE)&&!confirm('現在の進行を消して、SCENE 001から始めますか？'))return;st={scene:1,page:0,j:3,b:3,t:5,f:'2.8億',choice1:null,choice2:null};save();document.getElementById('titleScreen').style.display='none';render();updateContinue()}function continueGame(){load();document.getElementById('titleScreen').style.display='none';render()}function openTitle(){updateContinue();document.getElementById('titleScreen').style.display='flex'}function updateContinue(){let x=null;try{x=migrate(JSON.parse(localStorage.getItem(SAVE)||'null'))}catch(e){}let b=document.getElementById('continueBtn'),m=document.getElementById('continueMeta');if(!x){b.disabled=true;m.textContent='NO DATA'}else{b.disabled=false;m.textContent=x.scene===3?'SCENE 002 COMPLETE':`SCENE 00${x.scene} / PAGE ${x.page+1}`}}load();render();updateContinue();</script></body></html>
