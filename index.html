<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NOCTURNE INDUSTRIES</title>
<style>
:root{--bg:#05070b;--panel:rgba(8,10,15,.94);--line:#715f47;--gold:#c7a66f;--violet:#b07ad8;--text:#f2eee5;--muted:#aaa49a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030407;color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;overflow:hidden}button{font:inherit;color:inherit}#app{height:100dvh;display:grid;grid-template-rows:78px minmax(0,1fr);background:#05070a;overflow:hidden}.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:'logo actions' 'meta meta';background:rgba(7,9,14,.98);border-bottom:1px solid #30281f;z-index:10}.logo{grid-area:logo;display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:15px;letter-spacing:.06em}.mark{font-size:24px;color:var(--gold)}.actions{grid-area:actions;display:flex;gap:5px;align-items:center;padding-right:8px}.actions button{height:34px;padding:0 11px;border:1px solid #66543d;background:#0d1016;font-size:11px}.meta{grid-area:meta;display:flex;gap:10px;align-items:center;min-height:33px;padding:5px 12px 6px;border-top:1px solid #222832;font-size:11px;white-space:nowrap;overflow:hidden}.meta small{font-size:9px;color:#b3aa9d}.screen{height:100%;min-height:0;display:grid;grid-template-rows:28% 31% 31% 10%;position:relative;background:url('scene_2.png') 28% center/cover no-repeat;overflow:hidden}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,8,.05) 0%,rgba(3,5,8,.18) 27%,rgba(3,5,8,.82) 56%,rgba(3,5,8,.98) 100%);pointer-events:none}.character,.dialogue,.choices,.hud{position:relative;z-index:2}.character{grid-row:1;overflow:hidden}.card{position:absolute;left:10px;top:10px;width:min(56vw,205px);padding:10px 12px 11px;border:1px solid var(--line);background:rgba(8,10,15,.84);backdrop-filter:blur(6px)}.card h2{font-size:17px;margin:0 0 2px;font-weight:500}.role{font-size:9px;color:#d0c8be;margin-bottom:6px}.meterrow{display:flex;justify-content:space-between;font-size:9px;margin-top:6px}.meter{height:4px;margin-top:3px;background:#151923;border:1px solid #303643;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#5c3b83,#b07ad8)}.dialogue{grid-row:2;margin:0 9px 6px;padding:12px 14px;border:1px solid #756249;background:rgba(8,10,15,.94);backdrop-filter:blur(8px);overflow:auto;-webkit-overflow-scrolling:touch}.speaker{color:var(--violet);font-size:14px;margin-bottom:7px;font-weight:600}.text{font-size:14px;line-height:1.52;white-space:pre-wrap}.choices{grid-row:3;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:5px;margin:0 9px 6px;min-height:0}.choice{display:grid;grid-template-columns:39px 1fr;align-items:center;min-height:0;height:100%;border:1px solid #665945;background:rgba(8,10,15,.94);text-align:left;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.num{height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #4a4033;font-size:17px}.label{padding:4px 8px;font-size:12.5px;line-height:1.2}.label small{display:block;font-size:8.5px;color:#8e8b86;line-height:1.15;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choice:active,.choice.active{border-color:#b995d1;background:linear-gradient(90deg,rgba(66,37,88,.82),rgba(29,22,38,.95))}.hud{grid-row:4;display:grid;grid-template-columns:44% 56%;background:rgba(8,10,15,.99);border-top:1px solid #594a38}.params{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.p{text-align:center;border-right:1px solid #2b2f37}.p:last-child{border-right:0}.p span{display:block;font-size:8px}.p b{display:block;color:#e6c47f;font-size:15px;line-height:1.05}.finance{display:grid;grid-template-columns:1fr 1fr;align-items:center}.finance>div{padding:0 7px;border-left:1px solid #383026;overflow:hidden}.finance span{display:block;font-size:8px;color:#d5bd89}.finance b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finance small{display:block;font-size:7.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{position:fixed;top:84px;left:12px;right:12px;z-index:30;padding:9px 12px;border:1px solid #8e7552;background:#0b0e14;text-align:center;font-size:11px;display:none}.end{grid-row:2/4;margin:0 9px 6px;padding:24px 16px;border:1px solid #756249;background:rgba(8,10,15,.94);text-align:center;overflow:auto;z-index:2}.end h2{color:#d1b482;font-size:24px}.end p{font-size:13px;line-height:1.6;white-space:pre-wrap}.restart{height:38px;padding:0 16px;border:1px solid #756249;background:#10131a}@media(min-width:721px){html,body{overflow:auto}#app{height:auto;min-height:100vh;display:block}.top{min-height:70px;grid-template-columns:260px 1fr auto;grid-template-areas:'logo meta actions'}.meta{border-top:0;font-size:16px}.screen{min-height:calc(100vh - 70px);grid-template-columns:44% 56%;grid-template-rows:1fr 150px;background-position:center}.character{grid-column:1;grid-row:1}.card{width:250px;top:24px;left:18px}.dialogue{grid-column:2;grid-row:1;margin:22px 18px 8px;padding:24px 28px}.speaker{font-size:20px}.text{font-size:18px;line-height:1.7}.choices{grid-column:2;grid-row:1;align-self:end;margin:0 18px 22px;grid-template-rows:repeat(4,58px)}.hud{grid-column:1/3;grid-row:2}.params b{font-size:27px}.params span,.finance span{font-size:12px}.finance b{font-size:24px}.finance small{font-size:11px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="logo"><span class="mark">◇</span><b>NOCTURNE</b></div><div class="actions"><button id="log">LOG</button><button id="menu">MENU</button></div><div class="meta"><b id="chapter">PROLOGUE</b><span id="sub">招待</span><small id="day">DAY 1 / 09:10</small></div></header>
<div id="game"></div>
</div><div id="notice" class="notice"></div>
<script>
const scenes=[
{n:'ヴィクトリア・クロウ',r:'NOCTURNE INDUSTRIES CEO',sp:'ヴィクトリア・クロウ',tr:35,af:12,ch:'PROLOGUE',su:'招待',dy:'DAY 1 / 09:10',tx:'「あなたの力が必要です。」\n\n黒い高層ビルの最上階。ヴィクトリアは、衰退した子会社 NOCTURNE MATERIALS の再建をあなたに託した。',c:[['引き受ける','まず会社の状況を見せてください'],['条件を聞く','私に何を期待していますか？'],['彼女を観察する','この人は何を知っている？'],['冗談めかす','ずいぶん大きな仕事ですね']]},
{n:'エマ',r:'CEO室付 / 秘書',sp:'エマ',tr:62,af:38,ch:'CHAPTER 1',su:'初任務',dy:'DAY 2 / 10:31',tx:'「お待ちしていました。今日から私がサポートします。」\n\n金髪のポニーテールを揺らし、エマが笑う。工場には不可解な未使用区画と、消えた購買記録が残されていた。',c:[['工場へ向かう','現場を見れば何かわかる'],['数字を見る','購買・在庫・売上を突き合わせる'],['エマに聞く','彼女が気づいている違和感は？'],['CEOの狙いを考える','なぜ自分をここへ？']]},
{n:'エマ',r:'同行者',sp:'エマ',tr:76,af:54,ch:'CHAPTER 1',su:'B4',dy:'DAY 5 / 18:42',tx:'地下4階。存在しないはずの研究区画。\n\n扉の向こうから巨大な電力消費が検出される。エマを危険から遠ざけながら、あなたは施設へ入る。',c:[['先に装置を観察する','戦う前に状況を把握する'],['エマを後方へ','安全を最優先する'],['通信を試す','相手に意思があるか確認'],['電源を切る','危険源を停止させる']]},
{n:'イリーナ・ヴォルコワ',r:'VANTA / 技術戦闘員',sp:'イリーナ',tr:28,af:10,ch:'CHAPTER 1',su:'PROJECT EVE',dy:'DAY 5 / 19:03',tx:'銀髪の女性が機械の右腕を構える。だが敵意の奥に迷いが見える。\n\n「……主電源よ。原因はそこにある。」\n\n81MW。LEVEL Ω。装置の表示には MANUFACTURED: 2049。',c:[['段階的に電力を落とす','装置へのショックを避ける'],['イリーナに説明させる','PROJECT EVEとは何だ'],['彼女と協力する','今は状況解決を優先'],['装置に話しかける','中に誰かいる']]},
{n:'E-07',r:'PROJECT EVE / 人工生命',sp:'E-07',tr:60,af:58,ch:'CHAPTER 1',su:'EVE',dy:'DAY 5 / 19:21',tx:'PLEASE DON\'T TURN ME OFF.\n\nガラスの向こうの少女が目を開く。\n\n「Strategist. I have been waiting for you.」\n\n彼女は、あなたを知っている。あなたにはその記憶がない。',c:[['通信を開く','怖がらせないように話す'],['名前を聞く','君は誰？'],['装置を調べる','記憶データの矛盾を探す'],['イリーナを見る','彼女は何を知っている？']]},
{n:'EVE',r:'技術解析アシスタント',sp:'EVE',tr:83,af:80,ch:'CHAPTER 1',su:'CORPORATE ROUTE',dy:'DAY 6 / 11:18',tx:'「イヴ。……私、その名前が好き。」\n\n戦闘ではなく、所有権・警備・法務・記録を使って VANTA の突入を止めた。\n\nヴィクトリアから着信。彼女は、あなたが E-07 に名前をつけたことまで知っている。',c:[['ヴィクトリアと話す','彼女の情報量を確かめる'],['イヴを守る','会社の保護下に置く'],['イリーナを同行させる','彼女にも事情がある'],['全記録を保存する','今後の切り札になる']]},
{n:'EVE',r:'NOCTURNE MATERIALS / 仮採用',sp:'EVE',tr:91,af:92,ch:'CHAPTER 1',su:'新しい社員',dy:'DAY 7 / 12:16',tx:'「私、NOCTURNEで働きたい。」\n\nあなたはヴィクトリアの許可を待たず、イヴを技術解析アシスタントとして採用した。\n\nASTER DYNAMICS の株価が急落。4,000万円のSHORTは含み益 +710万円。',c:[['SHORTを維持する','構造的な悪材料と判断'],['利益確定する','確実に資金を増やす'],['追加情報を集める','次のニュースを待つ'],['投資よりイヴを見る','まず新入社員の処遇だ']]},
{n:'エマ',r:'CEO室付 / 調査担当',sp:'エマ',tr:88,af:68,ch:'CHAPTER 1',su:'HELIOS',dy:'DAY 7 / 12:47',tx:'「変なんです。毎月、同じ金額だけ買っています。」\n\n特殊セラミック部材。年間約4億8,000万円。売上0、使用0、在庫0。\n仕入先：HELIOS ADVANCED MATERIALS。\n\nイリーナはその名に反応し、イヴは呟いた。\n「そこ……NOCTURNEの会社だよ。」',c:[['3人に調査を分担する','エマ＝取引、イリーナ＝VANTA、イヴ＝記憶'],['ヴィクトリアへ直行','まずCEOに説明を求める'],['HELIOSを調べる','会社の正体から確認する'],['支払いを止める','資金流出を遮断する']]},
{n:'SYSTEM',r:'NOCTURNE INDUSTRIES',sp:'SYSTEM',tr:100,af:100,ch:'CHAPTER 1',su:'CONTINUE...',dy:'DAY 7 / 12:49',tx:'チームを三方向へ走らせ、あなたは断片を統合し始める。\n\nVictoriaとの会議まで、あとわずか。\n\n――現在のストーリー到達点――',c:[]}
];
let st=JSON.parse(localStorage.getItem('nocturne_mobile_v023')||'null')||{i:0,j:3,b:3,t:5,f:'2.8億',inv:'—',path:''};
function cp(){return `NI-WEB-C${st.i}-J${st.j}B${st.b}T${st.t}-P${st.path||'0'}`}
function flash(x){let n=document.getElementById('notice');n.textContent=x;n.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>n.style.display='none',1500)}
function choose(i){st.path+=i+1;if(st.i<scenes.length-1)st.i++;if(st.i>=6)st.inv='ASTER SHORT';localStorage.setItem('nocturne_mobile_v023',JSON.stringify(st));render()}
function render(){let s=scenes[st.i];document.getElementById('chapter').textContent=s.ch;document.getElementById('sub').textContent=s.su;document.getElementById('day').textContent=s.dy;let choices=s.c.map((x,i)=>`<button class="choice ${i===0?'active':''}" onclick="choose(${i})"><span class="num">${i+1}</span><span class="label">${x[0]}<small>${x[1]}</small></span></button>`).join('');document.getElementById('game').innerHTML=`<main class="screen"><section class="character"><div class="card"><h2>${s.n}</h2><div class="role">${s.r}</div><div class="meterrow"><span>信頼度</span><b>${s.tr}%</b></div><div class="meter"><i style="width:${s.tr}%"></i></div><div class="meterrow"><span>好感度 ♡</span><b>${s.af}%</b></div><div class="meter"><i style="width:${s.af}%;background:linear-gradient(90deg,#633c78,#cf75c6)"></i></div></div></section><section class="dialogue"><div class="speaker">${s.sp}</div><div class="text">${s.tx}</div></section>${s.c.length?`<section class="choices">${choices}</section>`:`<section class="end"><h2>CONTINUE...</h2><p>${s.tx}</p><button class="restart" onclick="restart()">最初から</button></section>`}<footer class="hud"><div class="params"><div class="p"><span>判断力</span><b>${st.j}</b></div><div class="p"><span>大胆さ</span><b>${st.b}</b></div><div class="p"><span>信頼</span><b>${st.t}</b></div></div><div class="finance"><div><span>FUNDS</span><b>${st.f}</b><small>利用可能資金</small></div><div><span>INVESTMENT</span><b>${st.inv}</b><small>${st.i>=6?'4,000万円 / +710万円':'ポジションなし'}</small></div></div></footer></main>`}
function restart(){if(confirm('最初からやり直しますか？')){localStorage.removeItem('nocturne_mobile_v023');st={i:0,j:3,b:3,t:5,f:'2.8億',inv:'—',path:''};render()}}
document.getElementById('log').onclick=()=>flash('LOGは次版で実装予定です');document.getElementById('menu').onclick=()=>flash('MENUは次版で実装予定です');render();
</script>
</body></html>
