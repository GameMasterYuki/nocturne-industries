<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scene 001 CG Rebuild Test</title><style>html,body{margin:0;background:#05070b;color:#eee;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:16px}#status{padding:10px 12px;border:1px solid #705a40;background:#0d1016;margin-bottom:12px}img{display:block;width:100%;height:auto;border:1px solid #705a40;background:#111}</style></head><body><main><div id="status">CGを復元中…</div><img id="cg" alt="Scene 001 Victoria CG"></main><script>(async()=>{const status=document.getElementById('status');try{const files=['part-000.b64','part-001.b64','part-002.b64','part-003.b64','part-004.b64'];const parts=await Promise.all(files.map(f=>fetch('chunks/scene_001_victoria/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.map(x=>x.trim()).join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:'image/webp'});const url=URL.createObjectURL(blob);const img=document.getElementById('cg');img.onload=()=>{status.textContent=`復元成功：${files.length}分割 → ${(blob.size/1024).toFixed(1)} KB WebP`;status.style.borderColor='#6d9b79'};img.onerror=()=>{throw new Error('復元画像をデコードできませんでした')};img.src=url}catch(e){status.textContent='復元失敗：'+e.message;status.style.borderColor='#a85d5d';console.error(e)}})();</script></body></html>
