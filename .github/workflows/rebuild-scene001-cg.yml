name: Rebuild Scene 001 CG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-scene001-cg.yml'
      - 'assets/chunks/scene_001_victoria_official_bin/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify official WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat assets/chunks/scene_001_victoria_official_bin/part-*.bin > assets/scene_001_victoria.webp
          test "$(wc -c < assets/scene_001_victoria.webp)" -eq 66946
          file assets/scene_001_victoria.webp
          echo "4c2b0a23751d5f236caf2ba131fbbe358fb69c0f850fb6b1035553ceb2066260  assets/scene_001_victoria.webp" | sha256sum -c -

      - name: Commit rebuilt image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene_001_victoria.webp
          if git diff --cached --quiet; then
            echo 'No image change.'
            exit 0
          fi
          git commit -m 'Rebuild verified Scene 001 Victoria CG'
          git push
