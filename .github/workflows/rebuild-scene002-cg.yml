name: Rebuild Scene 002 Emma CG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-scene002-cg.yml'
      - 'assets/chunks/scene_002_emma/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild Scene 002 Emma WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat assets/chunks/scene_002_emma/part-*.b64 | base64 --decode > assets/scene_002_emma.webp
          test "$(wc -c < assets/scene_002_emma.webp)" -eq 5876
          file assets/scene_002_emma.webp
          echo "83f546f657a918e8f9007a6d72f05eb80141d1e85bd58f576464144d2f060645  assets/scene_002_emma.webp" | sha256sum -c -
      - name: Commit rebuilt image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene_002_emma.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild verified Scene 002 Emma CG'
          git push
